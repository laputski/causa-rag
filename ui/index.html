      The tab had no icon at all and showed the browser's default globe.
      The mark follows the theme here because the browser paints the tab in it;
      the touch icon carries its own ground and its own fixed colours, because

      Both are generated by tools/build_mark.py from one layout, so the tab and
      the sidebar cannot drift apart.
    -->

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
