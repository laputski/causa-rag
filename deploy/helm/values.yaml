global:
  imagePullSecret: registry-secret
  imageRegistry: registry.example.com  # replace with your own registry

replicaCount:
  gateway: 2
  embedder: 2
  reranker: 1

gateway:
  image:
    repository: registry.example.com/causa-rag/api-gateway
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

ingestion:
  image:
    repository: registry.example.com/causa-rag/ingestion
    tag: latest
    pullPolicy: IfNotPresent
  corpusPvc: rag-corpus-pvc

qdrant:
  host: qdrant
  port: 6333

opensearch:
  host: opensearch
  port: 9200

redis:
  host: redis
  port: 6379

vllm:
  host: vllm
  port: 8000
  modelId: Qwen/Qwen2.5-7B-Instruct

---
# values-staging.yaml overrides
# replicaCount.gateway: 1
# gateway.hpa.enabled: false
