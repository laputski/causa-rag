name: causa-rag

# Dev environment.
# All images pulled from public registries for local dev.
# In production (air-gap) switch image: references to internal registry mirror.

services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  opensearch:
    image: opensearchproject/opensearch:2.19.6
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      path.repo: /usr/share/opensearch/snapshots
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      - opensearch_snapshots:/usr/share/opensearch/snapshots
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || wget -qO- http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch:
        condition: service_healthy

  # The API gateway deliberately runs on the host, not here. It shells out to
  # `docker compose` to provision per-Realm Neo4j, spawns the ingestion CLI as a
  # subprocess, reads eval/golden and domain_packs from the working tree, and
  # loads multi-gigabyte embedder weights. Containerising it would mean mounting
  # the docker socket into a service that also accepts file uploads. Start it
  # with `make api` or ./install.sh.

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  langfuse:
    image: langfuse/langfuse:2.90.0
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      DIRECT_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: supersecretlangfuse
      SALT: saltylangfuse123
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: local
      LANGFUSE_INIT_ORG_NAME: "Local"
      LANGFUSE_INIT_PROJECT_ID: causa-rag
      LANGFUSE_INIT_PROJECT_NAME: "RAG Platform"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: lf-pk-local-causa-rag
      LANGFUSE_INIT_PROJECT_SECRET_KEY: lf-sk-local-causa-rag
      LANGFUSE_INIT_USER_EMAIL: admin@example.com
      LANGFUSE_INIT_USER_NAME: "Admin"
      LANGFUSE_INIT_USER_PASSWORD: langfuseadmin123
    depends_on:
      langfuse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/public/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # LiteLLM proxy in front of the native (host) Ollama for graphrag indexing.
  # graphrag/fnllm (running on the host) talks to http://localhost:4000/v1; the
  # proxy owns a stable connection pool / retry / timeout and fans out to the
  # host's GPU-backed Ollama via host.docker.internal. This avoids graphrag's
  # reproducible fnllm↔Ollama stall after N extract_graph chunks. All loopback —
  # air-gap preserved (no traffic leaves the host).
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    # Only used when the GraphRAG index is (re)built — same `graph` profile
    # as the neo4j service it feeds. Not started by a plain `docker compose up`.
    profiles: ["graph"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-proxy.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health/liveliness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ragplatform
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # GraphRAG store. Optional — enable with: --profile graph.
  # Air-gap: switch image: to the internal registry mirror.
  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/ragplatform
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      # GDS in-memory graph projection (community detection) needs an
      # explicit heap, not the JVM's auto-detected default — otherwise a
      # large projection (current corpus: ~35k nodes / ~1M relationships)
      # risks an OOM mid-projection instead of a clean upfront rejection.
      NEO4J_server_memory_heap_initial__size: "2G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One Neo4j container per Realm, so parallel projects (different
  # customers, different graphs) don't share a graph even locally. Neo4j Community has no multi-database support and
  # the graph itself has no corpus_id/realm_id partitioning at all (unlike
  # Qdrant/OpenSearch, which ARE namespaced by realm_id — see
  # adapters/qdrant.py#_collection_name — so they need no per-Realm
  # container), so a separate container is the only real isolation for the
  # graph specifically.
  #
  # Per-Realm services beyond this base one are generated, not hand-copied:
  #   python3 -m tools.generate_realm_neo4j_compose
  #   docker compose -f deploy/compose/docker-compose.yml \
  #                   -f deploy/compose/neo4j-realms.generated.yml \
  #                   --profile graph-<realm_id> up -d
  # This base `neo4j` service stays bound to whichever Realm was registered
  # first (bolt://localhost:7687) — the generator never touches it.

volumes:
  qdrant_data:
  opensearch_data:
  opensearch_snapshots:
  langfuse_db_data:
  mongo_data:
  neo4j_data:
  # Per-Realm Neo4j volumes are declared in the generated
  # deploy/compose/neo4j-realms.generated.yml, not here.
