[build-system]
# 77 — не прихоть: строковая форма `license` и `license-files`
# появились в PEP 639, а его поддержка пришла в setuptools 77.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "causa-rag-client"
# This version number IS the contract version this
# client speaks (see causa_rag_client/client.py:CONTRACT_VERSION). A
# breaking change to the platform's external-RAG contract (core/models.py)
# bumps both together; run_experiment()/register_rag() refuse to proceed
# against a platform whose /external-rag-spec reports a different version,
# rather than silently sending a request the platform can't parse.
version = "1.0.0"
description = "Thin HTTP client for the RAG debugging/eval platform — register an external RAG, upload datasets, run experiments, fetch results."
readme = "README.md"
license = "Apache-2.0"
# Лицензия лежит копией рядом: сборка не выходит за корень пакета.
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["rag", "retrieval-augmented-generation", "evaluation", "llm", "information-retrieval"]
authors = [{ name = "Alexander Laputski" }]
# Классификаторы определяют, найдут ли пакет фильтрами на PyPI.
# Без них страница есть, а в поиске по теме пакета нет.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

# Ссылки — единственное, что уводит со страницы пакета в проект.
[project.urls]
Homepage = "https://github.com/laputski/causa-rag"
Repository = "https://github.com/laputski/causa-rag"
Documentation = "https://github.com/laputski/causa-rag/blob/main/docs/connector-guide.md"
"Contract reference" = "https://github.com/laputski/causa-rag/blob/main/docs/external-rag-contract.md"
Issues = "https://github.com/laputski/causa-rag/issues"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]
# Only needed for serve()/run_server(); register_rag/
# run_experiment/get_results never import fastapi/uvicorn at all.
serve = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
include = ["causa_rag_client*"]
