[build-system]
# 77 is not arbitrary: the string form of `license` and `license-files`
# come from PEP 639, and support for it landed in setuptools 77.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "causa-rag-client"
# The package's own version, which is NOT the contract version. This comment
# used to claim it was, and that had already stopped being true: the package
# read 1.0.0 while the platform's /external-rag-spec reported 1.1.0. The
# contract version lives in causa_rag_client/client.py:CONTRACT_VERSION and
# moves with the contract, not with this package. check_contract_version()
# refuses to proceed against a platform whose major version differs, rather
# than silently sending a request the platform cannot parse.
#
# Starting at 0.1.0 rather than 1.0.0 is deliberate. The contract has had one
# external implementer so far, this project's own reference server, so
# calling this client stable would be a promise made on a single data point.
version = "0.1.0"
description = "Thin HTTP client for the RAG debugging/eval platform — register an external RAG, upload datasets, run experiments, fetch results."
readme = "README.md"
license = "Apache-2.0"
# The licence sits here as a copy: a build does not reach outside the
# package root.
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["rag", "retrieval-augmented-generation", "evaluation", "llm", "information-retrieval"]
authors = [{ name = "Alexander Laputski" }]
# Classifiers decide whether the package is found by the filters on the
# index. Without them the page exists and the search does not reach it.
# No licence classifier here: `license` above is the PEP 639 expression
# form, and setuptools refuses a build that carries both.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
# Inside [project], and it has to stay above the [project.urls] header:
# everything after a table header belongs to that table, so this key sat in
# project.urls for one release. setuptools refused the whole file over it
# ("project.urls.dependencies must be string"), which meant the package did
# not build at all, and had it built, httpx would not have been declared.
dependencies = [
    "httpx>=0.27",
]

# Links are the only thing that carries a reader from the package page
# to the project.
[project.urls]
Homepage = "https://github.com/laputski/causa-rag"
Repository = "https://github.com/laputski/causa-rag"
Documentation = "https://github.com/laputski/causa-rag/blob/main/docs/connector-guide.md"
"Contract reference" = "https://github.com/laputski/causa-rag/blob/main/docs/external-rag-contract.md"
Issues = "https://github.com/laputski/causa-rag/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]
# Only needed for serve()/run_server(); register_rag/
# run_experiment/get_results never import fastapi/uvicorn at all.
serve = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
include = ["causa_rag_client*"]
