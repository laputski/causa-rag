<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" width="1120" height="460" role="img"
     aria-label="Two runs compared: the pair being compared, a metrics table with delta and verdict per metric">
  <title>Two runs, compared: what moved, by how much, and what it means</title>
  <desc>Drawn from ui/src/pages/ComparisonPage.tsx in the causa light palette. Real numbers, measured by make test-e2e over the demo corpus shipped with this repository: widening the context from five to ten keeps recall at 1.000 and drops precision from 0.795 to 0.290.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bg      { fill: #fcfcfa; }
    .rule    { stroke: #e2e1d9; }
    .ink     { stroke: #1a1a19; }
    .fg      { fill: #1a1a19; }
    .muted   { fill: #6f6d64; }
    .success { fill: #00795c; }
    .danger  { fill: #a4262c; }
  </style>

  <rect class="bg" width="1120" height="460"/>

  <text x="40" y="52" class="fg" font-size="27" font-weight="640">Comparison</text>
  <text x="212" y="50" class="muted mono" font-size="11.5">e2e-a41f ↔ e2e-b90c · demo handbook · 15 questions</text>

  <!-- ── the pair: what is being compared, stated rather than chosen ───── -->
  <line class="ink" x1="40" y1="72" x2="1080" y2="72"/>
  <line class="rule" x1="40" y1="140" x2="1080" y2="140"/>
  <g font-size="10.5">
    <text x="40"  y="92" class="muted" letter-spacing="0.5">BASELINE · A</text>
    <text x="580" y="92" class="muted" letter-spacing="0.5">CANDIDATE · B</text>
  </g>
  <text x="40"  y="116" class="fg" font-size="15.5" font-weight="600">baseline top-k 5</text>
  <text x="580" y="116" class="fg" font-size="15.5" font-weight="600">wider context top-k 10</text>
  <g class="mono muted" font-size="10">
    <text x="40"  y="132">e2e-a41f · top_k=5</text>
    <text x="580" y="132">e2e-b90c · top_k=10</text>
  </g>

  <!-- ── metrics: the number, the delta, the verdict, and what it means ── -->
  <text x="40" y="176" class="fg" font-size="15.5" font-weight="600">Metrics</text>
  <text x="1080" y="176" class="muted mono" font-size="10.5" text-anchor="end">noise threshold 5 % — the regression guard’s own</text>
  <line class="ink" x1="40" y1="185" x2="1080" y2="185"/>

  <g class="muted" font-size="10" letter-spacing="0.5">
    <text x="40"  y="202">METRIC</text>
    <text x="452" y="202" text-anchor="end">A</text>
    <text x="536" y="202" text-anchor="end">B</text>
    <text x="632" y="202" text-anchor="end">Δ</text>
    <text x="664" y="202">VERDICT</text>
    <text x="790" y="202">WHAT IT MEANS</text>
  </g>
  <line class="ink" x1="40" y1="210" x2="1080" y2="210"/>

  <g font-size="12.5">
    <text x="40"  y="232" class="fg">retrieval_recall_at_k</text>
    <text x="452" y="232" class="mono fg" text-anchor="end">1.000</text>
    <text x="536" y="232" class="mono fg" text-anchor="end">1.000</text>
    <text x="632" y="232" class="mono muted" text-anchor="end">±0</text>
    <text x="664" y="232" class="muted" font-size="11">unchanged</text>
    <text x="790" y="232" class="muted" font-size="11">Every required source is still in the results</text>
    <line class="rule" x1="40" y1="244" x2="1080" y2="244"/>

    <text x="40"  y="266" class="fg">retrieval_precision_at_k</text>
    <text x="452" y="266" class="mono fg" text-anchor="end">0.795</text>
    <text x="536" y="266" class="mono fg" text-anchor="end">0.290</text>
    <text x="632" y="266" class="mono danger" text-anchor="end">−63.5 %</text>
    <text x="664" y="266" class="danger" font-size="11">worse</text>
    <text x="790" y="266" class="muted" font-size="11">Each required one is buried among nine irrelevant</text>
    <line class="rule" x1="40" y1="278" x2="1080" y2="278"/>

    <text x="40"  y="300" class="fg">context_support</text>
    <text x="452" y="300" class="mono fg" text-anchor="end">0.875</text>
    <text x="536" y="300" class="mono fg" text-anchor="end">0.837</text>
    <text x="632" y="300" class="mono muted" text-anchor="end">−4.3 %</text>
    <text x="664" y="300" class="muted" font-size="11">noise</text>
    <text x="790" y="300" class="muted" font-size="11">Barely past the threshold, no conclusion on its own</text>
    <line class="rule" x1="40" y1="312" x2="1080" y2="312"/>

    <text x="40"  y="334" class="fg">grounded_in_correct_source</text>
    <text x="452" y="334" class="mono fg" text-anchor="end">0.846</text>
    <text x="536" y="334" class="mono fg" text-anchor="end">0.831</text>
    <text x="632" y="334" class="mono muted" text-anchor="end">−1.8 %</text>
    <text x="664" y="334" class="muted" font-size="11">noise</text>
    <text x="790" y="334" class="muted" font-size="11">Grounding in the returned context holds</text>
    <line class="rule" x1="40" y1="346" x2="1080" y2="346"/>

    <text x="40"  y="368" class="fg">correct_refusal</text>
    <text x="452" y="368" class="mono fg" text-anchor="end">0.867</text>
    <text x="536" y="368" class="mono fg" text-anchor="end">0.867</text>
    <text x="632" y="368" class="mono muted" text-anchor="end">±0</text>
    <text x="664" y="368" class="muted" font-size="11">unchanged</text>
    <text x="790" y="368" class="muted" font-size="11">Refusal where the corpus has no answer</text>
    <line class="rule" x1="40" y1="380" x2="1080" y2="380"/>
  </g>

  <text x="40" y="416" class="muted" font-size="11.5">Recall says the change was free; precision says what it cost.</text>
  <text x="40" y="434" class="muted" font-size="11.5">One run, two metrics, two different answers to “did this get better”.</text>
</svg>
