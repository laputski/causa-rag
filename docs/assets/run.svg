<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img"
     aria-label="The run screen: aggregate metrics as a band of numbers, the funnel showing where answers are lost, and the failing questions filtered by funnel layer">
  <title>One run, read from the top: metrics, funnel, then the questions that failed</title>
  <desc>Drawn from ui/src/pages/RunPage.tsx in the causa light palette. Numbers are run A of the paired comparison that make test-e2e produces over the demo corpus shipped with this repository: fifteen questions, top_k=5.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bg      { fill: #fcfcfa; }
    .border  { stroke: #e2e1d9; fill: none; }
    .rule    { stroke: #e2e1d9; }
    .ink     { stroke: #1a1a19; }
    .fg      { fill: #1a1a19; }
    .muted   { fill: #6f6d64; }
    .primary { fill: #1f4b8f; }
    .success { fill: #00795c; }
    .warning { fill: #8b6f00; }
    .danger  { fill: #a4262c; }
    .chip    { fill: #f4f3ee; }
  </style>

  <rect class="bg" width="1120" height="560"/>

  <!-- ── header: the run's name, then what identifies it ───────────────── -->
  <text x="40" y="52" class="fg" font-size="27" font-weight="640">baseline top-k 5</text>
  <text x="268" y="50" class="muted mono" font-size="11.5">e2e-a41f · 19.08 07:12 · 4 min 08 s</text>
  <g>
    <rect x="884" y="36" width="86" height="19" rx="9.5" fill="none" stroke="#7fb8a4"/>
    <circle cx="896" cy="45.5" r="3" class="success"/>
    <text x="905" y="49.5" class="success" font-size="10.5">white-box</text>
    <rect x="978" y="36" width="102" height="19" rx="9.5" fill="none" stroke="#7fb8a4"/>
    <circle cx="990" cy="45.5" r="3" class="success"/>
    <text x="999" y="49.5" class="success" font-size="10.5">no regression</text>
  </g>

  <!-- ── metrics: one band, full width, each number with its verdict ───── -->
  <text x="40" y="94" class="fg" font-size="15.5" font-weight="600">Metrics</text>
  <text x="1080" y="94" class="muted mono" font-size="10.5" text-anchor="end">15 questions · noise threshold 5 %</text>
  <line class="ink" x1="40" y1="103" x2="1080" y2="103"/>
  <line class="rule" x1="40" y1="180" x2="1080" y2="180"/>

  <g font-size="10.5">
    <text x="52"  y="124" class="muted" letter-spacing="0.5">RECALL@K</text>
    <text x="260" y="124" class="muted" letter-spacing="0.5">PRECISION@K</text>
    <text x="468" y="124" class="muted" letter-spacing="0.5">CONTEXT SUPPORT</text>
    <text x="676" y="124" class="muted" letter-spacing="0.5">GROUNDED IN SOURCE</text>
    <text x="884" y="124" class="muted" letter-spacing="0.5">CORRECT REFUSAL</text>
  </g>
  <g class="mono" font-size="21" font-weight="600">
    <text x="52"  y="152" class="success">1.000</text>
    <text x="260" y="152" class="fg">0.795</text>
    <text x="468" y="152" class="fg">0.875</text>
    <text x="676" y="152" class="fg">0.846</text>
    <text x="884" y="152" class="fg">0.867</text>
  </g>
  <g class="mono muted" font-size="10">
    <text x="52"  y="169">no baseline set</text>
    <text x="260" y="169">no baseline set</text>
    <text x="468" y="169">no baseline set</text>
    <text x="676" y="169">no baseline set</text>
    <text x="884" y="169">no baseline set</text>
  </g>
  <g class="rule">
    <line x1="248" y1="108" x2="248" y2="176"/>
    <line x1="456" y1="108" x2="456" y2="176"/>
    <line x1="664" y1="108" x2="664" y2="176"/>
    <line x1="872" y1="108" x2="872" y2="176"/>
  </g>

  <!-- ── funnel: which layer lost the answer ───────────────────────────── -->
  <text x="40" y="222" class="fg" font-size="15.5" font-weight="600">Where the answer is lost</text>
  <text x="1080" y="222" class="muted mono" font-size="10.5" text-anchor="end">15 questions</text>
  <line class="ink" x1="40" y1="231" x2="1080" y2="231"/>
  <line class="rule" x1="40" y1="304" x2="1080" y2="304"/>
  <rect x="820" y="232" width="260" height="72" fill="#faf6e8"/>
  <g font-size="10.5">
    <text x="52"  y="252" class="muted" letter-spacing="0.5">RETRIEVAL</text>
    <text x="312" y="252" class="muted" letter-spacing="0.5">RERANKER</text>
    <text x="572" y="252" class="muted" letter-spacing="0.5">GENERATION</text>
    <text x="832" y="252" class="muted" letter-spacing="0.5">LEADING CAUSE</text>
  </g>
  <g class="mono" font-size="21" font-weight="600">
    <text x="52"  y="280" class="fg">15</text>
    <text x="312" y="280" class="fg">15</text>
    <text x="572" y="280" class="fg">13</text>
    <text x="832" y="280" class="warning" font-size="15">generation</text>
  </g>
  <g class="mono muted" font-size="10">
    <text x="52"  y="296">found, of 15</text>
    <text x="312" y="296">0 dropped below top-k</text>
    <text x="572" y="296">2 ungrounded</text>
    <text x="832" y="296">2 questions</text>
  </g>
  <g class="rule">
    <line x1="300" y1="232" x2="300" y2="300"/>
    <line x1="560" y1="232" x2="560" y2="300"/>
    <line x1="820" y1="232" x2="820" y2="300"/>
  </g>

  <!-- ── the questions that failed, filtered by layer ──────────────────── -->
  <text x="40" y="346" class="fg" font-size="15.5" font-weight="600">Need attention</text>
  <text x="1080" y="346" class="muted mono" font-size="10.5" text-anchor="end">2 of 15</text>
  <line class="ink" x1="40" y1="355" x2="1080" y2="355"/>

  <g font-size="10.5">
    <rect x="40"  y="368" width="118" height="21" rx="10.5" class="fg"/>
    <text x="99"  y="382.5" fill="#fcfcfa" text-anchor="middle">All failing  2</text>
    <rect x="166" y="368" width="104" height="21" rx="10.5" fill="none" stroke="#e2e1d9"/>
    <text x="218" y="382.5" class="muted" text-anchor="middle">generation  2</text>
    <rect x="278" y="368" width="112" height="21" rx="10.5" fill="none" stroke="#e2e1d9"/>
    <text x="334" y="382.5" class="muted" text-anchor="middle">all questions  15</text>
  </g>

  <g font-size="12.5">
    <line class="rule" x1="40" y1="404" x2="1080" y2="404"/>
    <path d="M46 415 l6 5 -6 5" fill="none" stroke="#6f6d64" stroke-width="1.4"/>
    <rect x="62" y="411" width="76" height="18" rx="4" fill="#faf6e8"/>
    <text x="100" y="424" class="warning" font-size="10" text-anchor="middle">generation</text>
    <text x="150" y="424" class="fg">Who pays for a taxi from the airport on a business trip?</text>
    <text x="1080" y="424" class="mono muted" text-anchor="end">0.00</text>

    <line class="rule" x1="40" y1="437" x2="1080" y2="437"/>
    <path d="M46 448 l6 5 -6 5" fill="none" stroke="#6f6d64" stroke-width="1.4"/>
    <rect x="62" y="444" width="76" height="18" rx="4" fill="#faf6e8"/>
    <text x="100" y="457" class="warning" font-size="10" text-anchor="middle">generation</text>
    <text x="150" y="457" class="fg">How many people must sit on the acceptance committee?</text>
    <text x="1080" y="457" class="mono muted" text-anchor="end">0.00</text>
    <line class="rule" x1="40" y1="470" x2="1080" y2="470"/>
  </g>

  <text x="40" y="500" class="muted" font-size="11.5">The filter opens on the failing questions: the screen is opened to find them,</text>
  <text x="40" y="518" class="muted" font-size="11.5">not to scroll past fifteen rows all set the same way.</text>
</svg>
