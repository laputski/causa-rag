<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img"
     aria-label="The overview screen of the demo realm: status band, realm setup checklist, resource health, and recent runs">
  <title>Overview, the first screen of a configured realm</title>
  <desc>Drawn from ui/src/pages/OverviewPage.tsx in the causa light palette, with the numbers the demo realm actually holds: one corpus, fifteen questions, one prompt, two runs.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bg      { fill: #fcfcfa; }
    .surface { fill: #ffffff; }
    .border  { stroke: #e2e1d9; fill: none; }
    .rule    { stroke: #e2e1d9; }
    .fg      { fill: #1a1a19; }
    .muted   { fill: #6f6d64; }
    .primary { fill: #1f4b8f; }
    .success { fill: #00795c; }
    .warning { fill: #8b6f00; }
    .sidebar { fill: #f2f1ea; }
    .chip    { fill: #f4f3ee; }
  </style>

  <rect class="bg" width="1120" height="640"/>

  <!-- ── sidebar ────────────────────────────────────────────────────────── -->
  <rect class="sidebar" x="0" y="0" width="196" height="640"/>
  <line class="rule" x1="196" y1="0" x2="196" y2="640"/>

  <!-- the mark: three bars narrowing downward, the funnel the platform measures -->
  <g transform="translate(20, 22) scale(0.82)">
    <rect x="2.5" y="4"  width="19" height="4" rx="1.4" class="fg"/>
    <rect x="5.5" y="10" width="13" height="4" rx="1.4" class="fg" opacity=".62"/>
    <rect x="9"   y="16" width="6"  height="4" rx="1.4" class="fg" opacity=".34"/>
  </g>
  <text x="46" y="38" class="fg" font-size="14.5" font-weight="640">Causa</text>
  <text x="97" y="38" class="muted" font-size="14.5">RAG</text>

  <g font-size="12.5">
    <text x="20" y="76" class="muted" font-size="10.5" letter-spacing="0.6">OVERVIEW</text>
    <rect x="10" y="86" width="176" height="26" rx="6" fill="#e6e4da"/>
    <text x="22" y="103" class="fg" font-weight="600">Overview</text>

    <text x="20" y="136" class="muted" font-size="10.5" letter-spacing="0.6">CHAT</text>
    <text x="22" y="160" class="fg">Chat</text>

    <text x="20" y="192" class="muted" font-size="10.5" letter-spacing="0.6">RUNS</text>
    <text x="22" y="216" class="fg">Runs</text>
    <text x="22" y="242" class="fg">New run</text>
    <text x="22" y="268" class="fg">Comparison</text>
    <text x="22" y="294" class="fg">Frontier</text>

    <text x="20" y="326" class="muted" font-size="10.5" letter-spacing="0.6">DATA</text>
    <text x="22" y="350" class="fg">Corpus</text>
    <text x="22" y="376" class="fg">Questions</text>
    <text x="22" y="402" class="fg">Judgments</text>
    <text x="22" y="428" class="fg">Prompts</text>

    <text x="20" y="460" class="muted" font-size="10.5" letter-spacing="0.6">SETTINGS</text>
    <text x="22" y="484" class="fg">Resources</text>
    <text x="22" y="510" class="fg">Domain packs</text>
  </g>

  <line class="rule" x1="10" y1="556" x2="186" y2="556"/>
  <g font-size="12" class="muted">
    <text x="22" y="578">Commands</text>
    <text x="164" y="578" class="mono" font-size="11">⌘K</text>
    <text x="22" y="602">Guide</text>
  </g>

  <!-- ── header ─────────────────────────────────────────────────────────── -->
  <text x="228" y="46" class="fg" font-size="23" font-weight="650">Demo</text>
  <text x="228" y="68" class="muted" font-size="13">A worked example: the internal handbook of a fictional company</text>

  <rect x="836" y="28" width="106" height="30" rx="7" class="surface"/>
  <rect x="836.5" y="28.5" width="105" height="29" rx="7" class="border"/>
  <text x="889" y="47" class="fg" font-size="12.5" text-anchor="middle">Export JSON</text>

  <rect x="954" y="28" width="136" height="30" rx="7" fill="#1f4b8f"/>
  <text x="1022" y="47" fill="#ffffff" font-size="12.5" font-weight="560" text-anchor="middle">▶  New run</text>

  <!-- ── stat band ──────────────────────────────────────────────────────── -->
  <rect x="228" y="90" width="862" height="86" rx="9" class="surface"/>
  <rect x="228.5" y="90.5" width="861" height="85" rx="9" class="border"/>

  <g font-size="10.5" letter-spacing="0.5">
    <text x="252" y="114" class="muted">STATUS</text>
    <text x="424" y="114" class="muted">CORPORA</text>
    <text x="596" y="114" class="muted">QUESTIONS</text>
    <text x="768" y="114" class="muted">PROMPTS</text>
    <text x="940" y="114" class="muted">RUNS</text>
  </g>
  <g font-size="27" font-weight="620">
    <text x="252" y="146" class="success">3/3</text>
    <text x="424" y="146" class="fg">1</text>
    <text x="596" y="146" class="fg">15</text>
    <text x="768" y="146" class="fg">1</text>
    <text x="940" y="146" class="fg">2</text>
  </g>
  <g font-size="11.5" class="muted">
    <text x="252" y="164">checks healthy</text>
    <text x="424" y="164">data sets</text>
    <text x="596" y="164">in 1 set</text>
    <text x="768" y="164">answer templates</text>
    <text x="940" y="164">baseline 50cc4a94</text>
  </g>
  <line class="rule" x1="400" y1="108" x2="400" y2="158"/>
  <line class="rule" x1="572" y1="108" x2="572" y2="158"/>
  <line class="rule" x1="744" y1="108" x2="744" y2="158"/>
  <line class="rule" x1="916" y1="108" x2="916" y2="158"/>

  <!-- ── left: realm setup ──────────────────────────────────────────────── -->
  <text x="228" y="212" class="fg" font-size="14" font-weight="620">Realm setup</text>
  <text x="640" y="212" class="muted" font-size="12" text-anchor="end">5 of 5</text>
  <line class="rule" x1="228" y1="222" x2="640" y2="222"/>

  <g font-size="12.5">
    <circle cx="238" cy="243" r="7" class="success" opacity="0.14"/>
    <path d="M234.6 243l2.4 2.4 4.4-4.8" stroke="#00795c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <text x="254" y="247" class="success">All five steps are done.</text>
  </g>

  <g font-size="12.5">
    <!-- each row: a done tick, the label, and the way in -->
    <g>
      <circle cx="238" cy="277" r="8" class="success" opacity="0.14"/>
      <path d="M234.4 277l2.6 2.6 4.6-5" stroke="#00795c" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <text x="256" y="281" class="fg">Corpus loaded</text>
      <text x="392" y="281" class="muted" font-size="11.5">handbook, 42 chunks</text>
      <text x="640" y="281" class="primary" font-size="11.5" text-anchor="end">Open →</text>
    </g>
    <g>
      <circle cx="238" cy="309" r="8" class="success" opacity="0.14"/>
      <path d="M234.4 309l2.6 2.6 4.6-5" stroke="#00795c" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <text x="256" y="313" class="fg">Control questions entered</text>
      <text x="440" y="313" class="muted" font-size="11.5">15 questions</text>
      <text x="640" y="313" class="primary" font-size="11.5" text-anchor="end">Open →</text>
    </g>
    <g>
      <circle cx="238" cy="341" r="8" class="success" opacity="0.14"/>
      <path d="M234.4 341l2.6 2.6 4.6-5" stroke="#00795c" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <text x="256" y="345" class="fg">System prompt created</text>
      <text x="420" y="345" class="muted" font-size="11.5">Grounded handbook QA</text>
      <text x="640" y="345" class="primary" font-size="11.5" text-anchor="end">Open →</text>
    </g>
    <g>
      <circle cx="238" cy="373" r="8" class="success" opacity="0.14"/>
      <path d="M234.4 373l2.6 2.6 4.6-5" stroke="#00795c" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <text x="256" y="377" class="fg">Question generation preset</text>
      <text x="640" y="377" class="primary" font-size="11.5" text-anchor="end">Open →</text>
    </g>
    <g>
      <circle cx="238" cy="405" r="8" class="success" opacity="0.14"/>
      <path d="M234.4 405l2.6 2.6 4.6-5" stroke="#00795c" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <text x="256" y="409" class="fg">First run and baseline</text>
      <text x="640" y="409" class="primary" font-size="11.5" text-anchor="end">Open →</text>
    </g>
  </g>

  <!-- ── right: status ──────────────────────────────────────────────────── -->
  <text x="678" y="212" class="fg" font-size="14" font-weight="620">Status</text>
  <text x="1090" y="212" class="primary" font-size="12" text-anchor="end">Check everything</text>
  <line class="rule" x1="678" y1="222" x2="1090" y2="222"/>

  <g font-size="12.5">
    <g>
      <circle cx="686" cy="248" r="4" class="success"/>
      <text x="702" y="252" class="fg">Qdrant</text>
      <text x="800" y="252" class="muted" font-size="11.5">vector store</text>
      <text x="1090" y="252" class="success" font-size="11.5" text-anchor="end">up</text>
    </g>
    <g>
      <circle cx="686" cy="280" r="4" class="success"/>
      <text x="702" y="284" class="fg">OpenSearch</text>
      <text x="800" y="284" class="muted" font-size="11.5">sparse index</text>
      <text x="1090" y="284" class="success" font-size="11.5" text-anchor="end">up</text>
    </g>
    <g>
      <circle cx="686" cy="312" r="4" class="success"/>
      <text x="702" y="316" class="fg">Ollama</text>
      <text x="800" y="316" class="muted" font-size="11.5">qwen3:8b</text>
      <text x="1090" y="316" class="success" font-size="11.5" text-anchor="end">up</text>
    </g>
  </g>
  <text x="678" y="352" class="muted" font-size="11.5">Open full status</text>
  <text x="678" y="378" class="muted" font-size="11.5">Neo4j is not attached: the graph pipeline is optional and the demo</text>
  <text x="678" y="396" class="muted" font-size="11.5">realm leaves it out rather than showing a connector nobody started.</text>

  <!-- ── recent runs ────────────────────────────────────────────────────── -->
  <text x="228" y="452" class="fg" font-size="14" font-weight="620">Recent runs</text>
  <text x="1090" y="452" class="primary" font-size="12" text-anchor="end">All 2 →</text>
  <line class="rule" x1="228" y1="462" x2="1090" y2="462"/>

  <g font-size="10.5" letter-spacing="0.5" class="muted">
    <text x="228" y="486">RUN</text>
    <text x="440" y="486">DATASET</text>
    <text x="676" y="486" text-anchor="end">RECALL</text>
    <text x="790" y="486" text-anchor="end">PRECISION</text>
    <text x="912" y="486" text-anchor="end">SUPPORT</text>
    <text x="1042" y="486" text-anchor="end">REFUSAL</text>
  </g>

  <rect x="228" y="496" width="862" height="34" rx="6" class="chip"/>
  <g font-size="12.5">
    <text x="240" y="518" class="fg" font-weight="560">handbook baseline</text>
    <text x="368" y="518" class="mono muted" font-size="11">top_k=5</text>
    <text x="440" y="518" class="muted">handbook.v1.fast</text>
    <text x="676" y="518" class="mono fg" text-anchor="end">1.000</text>
    <text x="790" y="518" class="mono fg" text-anchor="end">0.795</text>
    <text x="912" y="518" class="mono fg" text-anchor="end">0.875</text>
    <text x="1042" y="518" class="mono fg" text-anchor="end">0.867</text>
    <text x="1082" y="518" class="success" font-size="10.5" text-anchor="end">base</text>
  </g>

  <g font-size="12.5">
    <text x="240" y="556" class="fg" font-weight="560">wider context</text>
    <text x="368" y="556" class="mono muted" font-size="11">top_k=10</text>
    <text x="440" y="556" class="muted">handbook.v1.fast</text>
    <text x="676" y="556" class="mono fg" text-anchor="end">1.000</text>
    <text x="790" y="556" class="mono" fill="#c0392b" text-anchor="end">0.290</text>
    <text x="912" y="556" class="mono fg" text-anchor="end">0.837</text>
    <text x="1042" y="556" class="mono fg" text-anchor="end">0.867</text>
  </g>
  <line class="rule" x1="228" y1="574" x2="1090" y2="574"/>

  <text x="228" y="602" class="muted" font-size="11.5">Precision fell by half while recall held. The averages alone would have called this change free.</text>
</svg>
