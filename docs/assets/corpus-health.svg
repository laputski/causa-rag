<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" role="img"
     aria-label="Corpus health: five counters, the length distribution as a histogram, and the findings ordered by severity">
  <title>Corpus health: the shape of the distribution, not just its mean</title>
  <desc>Drawn from ui/src/pages/CorpusPage.tsx in the causa light palette. Measured on the demo corpus shipped with this repository: sixteen chunks, average length 356 characters, no duplicates, and no structural path parsed for any of them.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bg      { fill: #fcfcfa; }
    .rule    { stroke: #e2e1d9; }
    .ink     { stroke: #1a1a19; }
    .fg      { fill: #1a1a19; }
    .muted   { fill: #6f6d64; }
    .primary { fill: #1f4b8f; }
    .success { fill: #00795c; }
    .warning { fill: #8b6f00; }
    .bar     { fill: #5b7fb8; }
    .warn    { fill: #c0885c; }
  </style>

  <rect class="bg" width="1120" height="470"/>

  <text x="40" y="52" class="fg" font-size="27" font-weight="640">Corpus health</text>
  <text x="304" y="50" class="muted mono" font-size="11.5">demo_corpus</text>

  <!-- five counters, each with the sub-line that says what it is counting -->
  <line class="ink" x1="40" y1="72" x2="1080" y2="72"/>
  <line class="rule" x1="40" y1="146" x2="1080" y2="146"/>
  <g font-size="10.5">
    <text x="52"  y="92" class="muted" letter-spacing="0.5">CHUNKS</text>
    <text x="260" y="92" class="muted" letter-spacing="0.5">MEAN LENGTH</text>
    <text x="468" y="92" class="muted" letter-spacing="0.5">DUPLICATES</text>
    <text x="676" y="92" class="muted" letter-spacing="0.5">NO STRUCTURE</text>
    <text x="884" y="92" class="muted" letter-spacing="0.5">HEADING ONLY</text>
  </g>
  <g class="mono" font-size="21" font-weight="600">
    <text x="52"  y="120" class="fg">16</text>
    <text x="260" y="120" class="fg">356</text>
    <text x="468" y="120" class="fg">0</text>
    <text x="676" y="120" class="warning">16</text>
    <text x="884" y="120" class="fg">0</text>
  </g>
  <g class="mono muted" font-size="10">
    <text x="260" y="137">from 122 to 510</text>
    <text x="676" y="137">path not parsed</text>
    <text x="884" y="137">almost no text</text>
  </g>
  <g class="rule">
    <line x1="248" y1="74" x2="248" y2="142"/>
    <line x1="456" y1="74" x2="456" y2="142"/>
    <line x1="664" y1="74" x2="664" y2="142"/>
    <line x1="872" y1="74" x2="872" y2="142"/>
  </g>

  <!-- the distribution, because a mean cannot tell one shape from another -->
  <text x="40" y="188" class="fg" font-size="15.5" font-weight="600">Length distribution</text>
  <text x="560" y="188" class="muted mono" font-size="10.5" text-anchor="end">deciles, characters</text>
  <line class="ink" x1="40" y1="197" x2="560" y2="197"/>
    <rect class="warn" x="52" y="358" width="46" height="38" rx="2"><title>2 chunks from 122 characters</title></rect>
    <rect class="warn" x="106" y="358" width="46" height="38" rx="2"><title>2 chunks from 161 characters</title></rect>
    <rect class="warn" x="160" y="393" width="46" height="3" rx="2"><title>0 chunks from 200 characters</title></rect>
    <rect class="bar" x="214" y="377" width="46" height="19" rx="2"><title>1 chunks from 238 characters</title></rect>
    <rect class="bar" x="268" y="393" width="46" height="3" rx="2"><title>0 chunks from 277 characters</title></rect>
    <rect class="bar" x="322" y="358" width="46" height="38" rx="2"><title>2 chunks from 316 characters</title></rect>
    <rect class="bar" x="376" y="377" width="46" height="19" rx="2"><title>1 chunks from 355 characters</title></rect>
    <rect class="bar" x="430" y="358" width="46" height="38" rx="2"><title>2 chunks from 394 characters</title></rect>
    <rect class="bar" x="484" y="377" width="46" height="19" rx="2"><title>1 chunks from 432 characters</title></rect>
    <rect class="bar" x="538" y="300" width="46" height="96" rx="2"><title>5 chunks from 471 characters</title></rect>
  <line class="rule" x1="52" y1="396" x2="546" y2="396"/>
  <g class="mono muted" font-size="10">
    <text x="52"  y="412">122</text>
    <text x="299" y="412" text-anchor="middle">356</text>
    <text x="546" y="412" text-anchor="end">510</text>
  </g>
  <text x="52" y="436" class="muted" font-size="11">Four chunks fall under two hundred characters — headings split from their bodies.</text>
  <text x="52" y="452" class="muted" font-size="11">A mean of 356 does not say so; the shape of the distribution does.</text>

  <!-- what to fix, worst first -->
  <text x="600" y="188" class="fg" font-size="15.5" font-weight="600">What to fix</text>
  <text x="1080" y="188" class="muted mono" font-size="10.5" text-anchor="end">by severity</text>
  <line class="ink" x1="600" y1="197" x2="1080" y2="197"/>

  <circle cx="608" cy="222" r="3.5" class="warning"/>
  <text x="622" y="226" class="fg" font-size="12.5" font-weight="600">No structural path was parsed for any chunk</text>
  <text x="622" y="244" class="muted" font-size="11">All 16 chunks carry no structural path.</text>
  <text x="622" y="260" class="muted" font-size="11">A source reference cannot be built for an answer.</text>
  <line class="rule" x1="600" y1="276" x2="1080" y2="276"/>

  <circle cx="608" cy="300" r="3.5" class="success"/>
  <text x="622" y="304" class="fg" font-size="12.5" font-weight="600">No duplicates</text>
  <text x="622" y="322" class="muted" font-size="11">No text repeats: one chunk does not take two</text>
  <text x="622" y="338" class="muted" font-size="11">places in top-k instead of one.</text>
  <line class="rule" x1="600" y1="354" x2="1080" y2="354"/>

  <circle cx="608" cy="378" r="3.5" class="warning"/>
  <text x="622" y="382" class="fg" font-size="12.5" font-weight="600">The lowest deciles fall under 200 characters</text>
  <text x="622" y="400" class="muted" font-size="11">Looks like a split on a heading. Checked on the</text>
  <text x="622" y="416" class="muted" font-size="11">“Content” tab with the length filter.</text>
</svg>
