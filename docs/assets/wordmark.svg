<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" width="260" height="48" role="img" aria-label="Causa RAG">
  <title>Causa RAG</title>
  <style>
    .fg { fill: #1f2328; }
    /* The word "RAG" sits back; the thread through the funnel does not.
       Two different jobs, so two classes rather than one reused. */
    .accent { fill: #6b7280; }
    .thread { fill: #0072B2; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e6edf3; }
      .accent { fill: #8b949e; }
      .thread { fill: #4EA3DC; }
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- The mark: the funnel the platform measures, as three narrowing steps.
       Everything retrieved, what survived reranking, what reached the answer. -->
  <g transform="translate(2, 6) scale(1.5)">
    <rect x="0.48" y="5.28" width="3.84" height="3.84" class="fg"/>
    <rect x="5.28" y="5.28" width="3.84" height="3.84" class="fg"/>
    <rect x="14.88" y="5.28" width="3.84" height="3.84" class="fg"/>
    <rect x="19.68" y="5.28" width="3.84" height="3.84" class="fg"/>
    <rect x="10.08" y="5.28" width="3.84" height="3.84" class="thread"/>
    <rect x="5.28" y="10.08" width="3.84" height="3.84" class="fg"/>
    <rect x="14.88" y="10.08" width="3.84" height="3.84" class="fg"/>
    <rect x="10.08" y="10.08" width="3.84" height="3.84" class="thread"/>
    <rect x="10.08" y="14.88" width="3.84" height="3.84" class="thread"/>
  </g>

  <text x="46" y="33" font-size="25" font-weight="640" letter-spacing="-0.4" class="fg">Causa</text>
  <text x="128" y="33" font-size="25" font-weight="420" letter-spacing="0.6" class="accent">RAG</text>
</svg>
